  .pulse { opacity: .15; animation: pulse 6s ease-in-out infinite; }
  .ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ring 6s ease-out infinite; }
  .role { opacity: 0; animation-duration: 9s; animation-iteration-count: infinite; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes scan { from { transform: translateX(400px); } to { transform: translateX(1300px); } }
  @keyframes pulse { 0%, 50% { opacity: .15; } 56% { opacity: 1; } 80% { opacity: .9; } 100% { opacity: .15; } }
  @keyframes ring { 0%, 52% { transform: scale(.4); opacity: 0; } 55% { opacity: .9; } 85%, 100% { transform: scale(3); opacity: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes role0{0%,0.0%{opacity:0;transform:translateY(8px)}4.0%,29.3%{opacity:1;transform:none}33.3%,100%{opacity:0;transform:translateY(-8px)}}
